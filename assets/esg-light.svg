<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="title description">
  <title id="title">Explainable ESG Risk and Reporting</title>
  <desc id="description">Leakage-aware CatBoost modeling, SHAP evidence, and a validated FastAPI reporting layer. OOF RMSE 4.870 versus baseline 6.890 across 430 companies.</desc>
  <rect width="980" height="300" fill="#f7f3ea"/>
  <rect x="68" y="38" width="3" height="206" fill="#7a3127"/>
  <text x="92" y="55" fill="#7a3127" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.6">APPLIED MACHINE LEARNING / 02</text>
  <text x="92" y="103" fill="#20201e" font-family="Georgia, 'Times New Roman', serif" font-size="35" letter-spacing="0.25">Explainable ESG Risk &amp; Reporting</text>
  <text x="92" y="142" fill="#5f5850" font-family="Georgia, 'Times New Roman', serif" font-size="17">A leakage-aware modeling benchmark, SHAP evidence bundle, and validated</text>
  <text x="92" y="168" fill="#5f5850" font-family="Georgia, 'Times New Roman', serif" font-size="17">reporting API with explicit data, evaluation, and deployment boundaries.</text>
  <line x1="92" y1="198" x2="912" y2="198" stroke="#c9c0b3" stroke-width="1"/>
  <text x="92" y="226" fill="#20201e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">OOF RMSE 4.870</text>
  <text x="245" y="226" fill="#6d655b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">BASELINE 6.890</text>
  <text x="395" y="226" fill="#6d655b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">430 COMPANIES</text>
  <text x="912" y="226" fill="#7a3127" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="end">OPEN REPOSITORY ↗</text>
  <text x="92" y="263" fill="#7a3127" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="0.7">2025 ZHIXIANG CUP · GRAND PRIZE</text>
  <text x="92" y="282" fill="#82786c" font-family="Georgia, 'Times New Roman', serif" font-size="12">Awarded to the original competition case; the repository documents the subsequent engineering release.</text>
</svg>
